site_name: osquery for Mere Mortals
site_description: Ask your computer questions in SQL. osquery turns an operating system into tables you can query — processes, ports, packages, users — with an interactive shell for asking now, query packs for asking together, and a daemon that asks on a schedule and logs how the answers change, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/osquery-for-mere-mortals/
